name: Despliegue

# DEP-C-05 (HU-22): despliegue automático en AWS con los mismos scripts que se usan en local.
# El entorno sigue la decisión de operación del 2026-10-25: se enciende solo cuando se usa.
#
# - Al integrar en main: publica las imágenes del backend y de la Lambda en ECR y la landing.
#   Si el entorno está encendido, además lo actualiza con el código nuevo (panel incluido).
#   Si está apagado, no enciende nada (sin costo).
# - Manual (Actions -> Despliegue -> Run workflow, desde main): "encender" o "apagar". Quien lo
#   ejecuta da la autorización explícita para usar el entorno.
#
# Acceso a AWS sin claves guardadas: rol vael-github-despliegue por OIDC (infra/aws/acceso.yaml),
# que solo puede asumir este repositorio desde main. Configuración del repositorio:
#   variables: VAEL_ROL_GITHUB, VAEL_ROL_CFN y, opcional, CORREO_ALARMAS
#   secretos:  GEMINI_API_KEY y SEED_PASSWORD (solo para encender)
"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accion:
        description: Qué hacer con el entorno de AWS
        type: choice
        options: [encender, apagar]
        required: true

permissions:
  id-token: write  # token OIDC para asumir el rol de AWS
  contents: read

# Un solo despliegue a la vez: encender y apagar no deben pisarse
concurrency:
  group: vael-aws
  cancel-in-progress: false

jobs:
  desplegar:
    name: ${{ github.event_name == 'push' && 'Publicar main' || inputs.accion }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-1
      VAEL_ROL_CFN: ${{ vars.VAEL_ROL_CFN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node para el build del panel
        if: github.event_name == 'push' || inputs.accion == 'encender'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias del frontend
        if: github.event_name == 'push' || inputs.accion == 'encender'
        working-directory: frontend
        run: npm ci

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.VAEL_ROL_GITHUB }}
          aws-region: us-east-1
          role-duration-seconds: 7200

      - name: Publicar main (actualiza el entorno solo si está encendido)
        if: github.event_name == 'push'
        shell: pwsh
        run: ./scripts/aws-encender.ps1 -Perfil "" -SoloSiEncendido -CorreoAlarmas "${{ vars.CORREO_ALARMAS }}"

      - name: Encender el entorno
        if: github.event_name == 'workflow_dispatch' && inputs.accion == 'encender'
        shell: pwsh
        run: ./scripts/aws-encender.ps1 -Perfil "" -CorreoAlarmas "${{ vars.CORREO_ALARMAS }}"

      - name: Apagar el entorno
        if: github.event_name == 'workflow_dispatch' && inputs.accion == 'apagar'
        shell: pwsh
        run: ./scripts/aws-apagar.ps1 -Perfil ""
