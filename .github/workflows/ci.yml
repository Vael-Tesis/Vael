name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Tests y lint (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vael
          POSTGRES_PASSWORD: vael
          POSTGRES_DB: vael_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vael -d vael_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DEBUG: "true"
      # Un rol por uso (DEC-010); el superusuario del servicio solo crea los roles.
      DATABASE_ADMIN_URL: postgresql+asyncpg://vael:vael@localhost:5432/vael_db
      DATABASE_URL: postgresql+asyncpg://vael_app:vael_app_ci@localhost:5432/vael_db
      DATABASE_SYSTEM_URL: postgresql+asyncpg://vael_system:vael_system_ci@localhost:5432/vael_db
      DATABASE_OWNER_URL: postgresql+asyncpg://vael_owner:vael_owner_ci@localhost:5432/vael_db
      SECRET_KEY: ci-test-secret-key-minimo-32-caracteres
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_LIVE_MODEL: gemini-2.5-flash-native-audio-preview-12-2025
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: vael-storage-test
      SES_REGION: us-east-1
      EMAIL_FROM: noreply@vael.ai
      EMAIL_FROM_NAME: VAEL
      INTERNAL_SERVICE_KEY: ci-internal-secret
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Crear roles de base de datos (DEC-010)
        run: python -m app.scripts.crear_roles

      - name: Aplicar migraciones como vael_owner (alembic upgrade head)
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest -v

  frontend:
    name: Contrato, tipos y build (frontend)
    runs-on: ubuntu-latest

    # Solo para exportar el OpenAPI: la app se importa, pero no se conecta a ninguna base.
    env:
      ENVIRONMENT: test
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://vael_app:sin-uso@localhost:5432/vael_db
      DATABASE_SYSTEM_URL: postgresql+asyncpg://vael_system:sin-uso@localhost:5432/vael_db
      DATABASE_OWNER_URL: postgresql+asyncpg://vael_owner:sin-uso@localhost:5432/vael_db
      SECRET_KEY: ci-test-secret-key-minimo-32-caracteres
      INTERNAL_SERVICE_KEY: ci-internal-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Exportar el OpenAPI del backend
        working-directory: backend
        run: python -m app.scripts.exportar_openapi

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Generar el cliente tipado (DEC-008)
        working-directory: frontend
        run: npm run api:generar

      - name: El contrato versionado está al día
        run: |
          if ! git diff --exit-code -- frontend/openapi.json frontend/src/api/esquema.d.ts; then
            echo "::error::El contrato cambió: ejecuta 'python -m app.scripts.exportar_openapi' y 'npm run api:generar' y commitea el resultado."
            exit 1
          fi

      - name: Tipos (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build (vite build)
        working-directory: frontend
        run: npx vite build
