<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{% block titulo %}VAEL{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#1a1a2e;padding:24px 32px;">
              <span style="color:#ffffff;font-size:20px;font-weight:bold;">VAEL</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#1a1a2e;font-size:15px;line-height:1.6;">
              {% block contenido %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;background-color:#f4f4f7;color:#8a8a99;font-size:12px;">
              Este es un correo automático de VAEL — no respondas a esta dirección.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
