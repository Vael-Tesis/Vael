[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# La URL real se toma de settings.database_url (core/config.py) dentro de env.py —
# se deja vacía aquí a propósito para no duplicar/hardcodear credenciales.
sqlalchemy.url =


[post_write_hooks]
# hooks de formateo/lint sobre las migraciones generadas — deshabilitado por ahora


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
